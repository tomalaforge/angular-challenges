<div
  class="rounded-lg border border-slate-200 bg-slate-50/40 p-4"
  data-testid="email-item">
  <div class="flex items-center justify-between gap-4">
    <h3 class="text-sm font-semibold text-slate-700">
      Email {{ index() + 1 }}
    </h3>
    <button
      type="button"
      class="btn-danger"
      aria-label="Remove email {{ index() + 1 }}"
      (click)="remove.emit()">
      Remove
    </button>
  </div>

  <div class="mt-4 grid gap-4 sm:grid-cols-2">
    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
      Type
      <select class="input" [formField]="emailForm().type">
        <option value="personal">Personal</option>
        <option value="professional">Professional</option>
        <option value="other">Other</option>
      </select>
      <app-validation [fieldState]="emailForm().type()" />
    </label>
    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
      Email
      <input
        class="input"
        type="email"
        [formField]="emailForm().email"
        aria-required="true" />
      <app-validation [fieldState]="emailForm().email()" />
    </label>
  </div>
</div>
