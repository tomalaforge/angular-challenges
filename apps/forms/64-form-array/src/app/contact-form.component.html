<div
  class="rounded-lg border border-slate-200 bg-slate-50/40 p-4"
  data-testid="contact-item">
  <div class="flex items-center justify-between gap-4">
    <h3 class="text-sm font-semibold text-slate-700">
      Contact {{ index() + 1 }}
    </h3>
    <button
      type="button"
      class="btn-danger"
      aria-label="Remove contact {{ index() + 1 }}"
      (click)="remove.emit()">
      Remove
    </button>
  </div>

  <div class="mt-4 grid gap-4 sm:grid-cols-2">
    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
      First name
      <input
        class="input"
        type="text"
        [formField]="formField().firstname"
        aria-required="true" />
      <app-validation-message [fieldState]="formField().firstname()" />
    </label>
    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
      Last name
      <input
        class="input"
        type="text"
        [formField]="formField().lastname"
        aria-required="true" />
      <app-validation-message [fieldState]="formField().lastname()" />
    </label>
    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
      Relation
      <input
        class="input"
        type="text"
        [formField]="formField().relation"
        aria-required="true" />
      <app-validation-message [fieldState]="formField().relation()" />
    </label>
    <label class="flex flex-col gap-1 text-sm font-medium text-slate-700">
      Email
      <input
        class="input"
        type="email"
        [formField]="formField().email"
        aria-required="true" />
      <app-validation-message [fieldState]="formField().email()" />
    </label>
  </div>
</div>
